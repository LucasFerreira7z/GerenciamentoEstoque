<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
        />
        <meta name="theme-color" content="#0a0a0a" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <title>Estoque do Beiço</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div id="app">
            <!-- TOP BAR -->
            <div class="topbar">
                <div class="logo">
                    Estoque do Beiço<small
                        >gestão de estoque &amp; pedidos</small
                    >
                </div>
                <button class="clear-btn" onclick="clearAll()">
                    <i class="ti ti-trash"></i> Limpar tudo
                </button>
            </div>

            <!-- TABS -->
            <div class="tabs">
                <button class="tab active" onclick="showTab('estoque')">
                    <i class="ti ti-package"></i>
                    <span class="tab-label">Estoque</span>
                </button>
                <button class="tab" onclick="showTab('pedidos')">
                    <i class="ti ti-tools-kitchen-2"></i>
                    <span class="tab-label">Pedidos</span>
                </button>
                <button class="tab" onclick="showTab('dashboard')">
                    <i class="ti ti-chart-bar"></i>
                    <span class="tab-label">Dashboard</span>
                </button>
            </div>

            <!-- ═══ ESTOQUE ═══ -->
            <div id="tab-estoque" class="section active">
                <div class="card">
                    <div class="card-title">Adicionar produto</div>
                    <div class="add-prod-row">
                        <input
                            class="inp"
                            id="pn"
                            placeholder="Nome do produto"
                        />
                        <input
                            class="inp"
                            id="pp"
                            type="number"
                            min="0"
                            step="0.01"
                            inputmode="decimal"
                            placeholder="Preço de venda (R$)"
                        />
                        <input
                            class="inp"
                            id="pc2"
                            type="number"
                            min="0"
                            step="0.01"
                            inputmode="decimal"
                            placeholder="Custo (R$) — opcional"
                        />
                        <button class="btn" onclick="addProd()">
                            <i class="ti ti-plus"></i> Adicionar
                        </button>
                    </div>
                </div>

                <div class="card" style="margin-bottom: 0">
                    <div
                        style="
                            display: flex;
                            align-items: center;
                            justify-content: space-between;
                            margin-bottom: 0.9rem;
                        "
                    >
                        <span class="card-title" style="margin: 0"
                            >Produtos cadastrados</span
                        >
                        <span
                            id="pcount"
                            style="font-size: 0.78rem; color: var(--muted)"
                            >0 itens</span
                        >
                    </div>
                    <div id="plist" class="prod-grid">
                        <div class="empty" style="grid-column: 1/-1">
                            <i class="ti ti-package"></i>Nenhum produto ainda.
                        </div>
                    </div>
                </div>
            </div>

            <!-- ═══ PEDIDOS ═══ -->
            <div id="tab-pedidos" class="section">
                <div class="new-person-row">
                    <input
                        class="inp"
                        id="per-inp"
                        placeholder="Nome da pessoa"
                        style="flex: 1"
                    />
                    <button class="btn" onclick="addPerson()">
                        <i class="ti ti-user-plus"></i>
                        <span class="tab-label">Adicionar</span>
                    </button>
                </div>
                <div id="persons-list">
                    <div class="empty">
                        <i class="ti ti-users"></i>Adicione pessoas para
                        registrar pedidos.
                    </div>
                </div>
            </div>

            <!-- ═══ DASHBOARD ═══ -->
            <div id="tab-dashboard" class="section">
                <div class="summary-strip" id="metrics"></div>
                <div id="lucro-banner" style="display: none"></div>
                <div class="dash-grid">
                    <div class="dash-section">
                        <div class="dash-title">
                            <i class="ti ti-clock-check"></i> Pagamentos
                            recebidos
                        </div>
                        <div id="pay-hist" class="pay-history">
                            <div class="empty" style="padding: 1.2rem">
                                <i class="ti ti-coin"></i>Nenhum pagamento
                                ainda.
                            </div>
                        </div>
                    </div>
                    <div class="dash-section">
                        <div class="dash-title">
                            <i class="ti ti-chart-bar"></i> Pedido por pessoa
                        </div>
                        <div id="bars" class="bar-wrap">
                            <div class="empty" style="padding: 1.2rem">
                                <i class="ti ti-chart-bar"></i>Sem dados.
                            </div>
                        </div>
                    </div>
                </div>
                <div class="dash-section">
                    <div class="dash-title">
                        <i class="ti ti-circle-check"></i> Status de pagamentos
                    </div>
                    <div class="prog-ring" id="rings">
                        <div class="empty" style="padding: 0.8rem">
                            Sem pessoas cadastradas.
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- /#app -->

        <div class="toast" id="toast"></div>
        <script src="app.js"></script>
    </body>
</html>
