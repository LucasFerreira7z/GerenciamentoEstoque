<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gerenciamento de Estoque</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
        />
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap");
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            :root {
                --R: #ff1111;
                --Rd: #cc0000;
                --Rbg: rgba(255, 17, 17, 0.1);
                --Rborder: #5a0000;
                --G: #27a85b;
                --Gbg: rgba(39, 168, 91, 0.1);
                --bg: #0a0a0a;
                --bg2: #141414;
                --bg3: #1e1e1e;
                --border: #2a2a2a;
                --text: #f0f0f0;
                --muted: #666;
            }
            body {
                font-family: "DM Sans", sans-serif;
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
            }
            #app {
                max-width: 960px;
                margin: 0 auto;
                padding: 1.5rem;
            }

            .logo {
                font-family: "Bebas Neue", sans-serif;
                font-size: 2.4rem;
                color: var(--R);
                letter-spacing: 3px;
                line-height: 1;
            }
            .logo small {
                color: var(--muted);
                font-size: 0.82rem;
                font-family: "DM Sans", sans-serif;
                letter-spacing: 0.5px;
                font-weight: 300;
                display: block;
            }
            .topbar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding-bottom: 1.25rem;
                border-bottom: 1px solid var(--Rborder);
                margin-bottom: 1.25rem;
            }
            .clear-btn {
                background: transparent;
                border: 1px solid var(--Rborder);
                color: var(--R);
                border-radius: 9px;
                padding: 0.45rem 0.9rem;
                font-size: 0.76rem;
                font-weight: 600;
                cursor: pointer;
                font-family: "DM Sans", sans-serif;
                transition: all 0.2s;
            }
            .clear-btn:hover {
                background: var(--Rbg);
            }

            .tabs {
                display: flex;
                gap: 4px;
                background: var(--bg2);
                padding: 4px;
                border-radius: 12px;
                border: 1px solid var(--Rborder);
                margin-bottom: 1.25rem;
            }
            .tab {
                flex: 1;
                padding: 0.6rem 0.9rem;
                text-align: center;
                border-radius: 9px;
                font-size: 0.84rem;
                font-weight: 500;
                cursor: pointer;
                color: var(--muted);
                background: transparent;
                border: none;
                transition: all 0.2s;
                white-space: nowrap;
            }
            .tab.active {
                background: var(--R);
                color: #fff;
            }
            .tab:hover:not(.active) {
                color: var(--text);
                background: var(--bg3);
            }
            .section {
                display: none;
            }
            .section.active {
                display: block;
            }

            .card {
                background: var(--bg2);
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 1.2rem 1.3rem;
                margin-bottom: 0.75rem;
            }
            .card-title {
                font-family: "Bebas Neue", sans-serif;
                font-size: 1.2rem;
                letter-spacing: 1px;
                color: var(--R);
                margin-bottom: 0.95rem;
            }

            .inp {
                background: var(--bg3);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 0.65rem 1rem;
                font-size: 0.9rem;
                color: var(--text);
                font-family: "DM Sans", sans-serif;
                outline: none;
                transition: border 0.2s;
            }
            .inp:focus {
                border-color: var(--R);
            }
            .sel {
                background: var(--bg3);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 0.6rem 0.9rem;
                color: var(--text);
                font-family: "DM Sans", sans-serif;
                font-size: 0.85rem;
                outline: none;
                transition: border 0.2s;
            }
            .sel:focus {
                border-color: var(--R);
            }
            option {
                background: #1e1e1e;
            }

            .btn {
                background: var(--R);
                color: #fff;
                border: none;
                border-radius: 10px;
                padding: 0.65rem 1.2rem;
                font-size: 0.84rem;
                font-weight: 600;
                cursor: pointer;
                font-family: "DM Sans", sans-serif;
                transition: all 0.15s;
                white-space: nowrap;
            }
            .btn:hover {
                background: var(--Rd);
                transform: scale(1.02);
            }
            .btn:active {
                transform: scale(0.98);
            }
            .btn-ghost {
                background: transparent;
                border: 1px solid var(--border);
                color: var(--muted);
            }
            .btn-ghost:hover {
                border-color: var(--R);
                color: var(--R);
                background: transparent;
                transform: none;
            }
            .btn-green {
                background: var(--G);
            }
            .btn-green:hover {
                background: #1e8a49;
            }
            .btn-orange {
                background: #b35a00;
            }
            .btn-orange:hover {
                background: #8a4500;
            }
            .btn-sm {
                padding: 0.4rem 0.8rem;
                font-size: 0.77rem;
                border-radius: 8px;
            }

            .prod-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
                gap: 0.6rem;
                margin-top: 0.75rem;
            }
            .prod-card {
                background: var(--bg3);
                border: 1px solid var(--Rborder);
                border-radius: 12px;
                padding: 0.9rem;
                position: relative;
                overflow: hidden;
            }
            .prod-card::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 3px;
                height: 100%;
                background: var(--R);
            }
            .prod-nm {
                font-weight: 600;
                font-size: 0.92rem;
                margin-bottom: 0.35rem;
            }
            .prod-row {
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .prod-price {
                color: var(--R);
                font-weight: 600;
                font-size: 0.9rem;
            }
            .prod-stk {
                font-size: 0.73rem;
                color: var(--muted);
                background: var(--bg2);
                padding: 2px 8px;
                border-radius: 20px;
            }
            .prod-stk.low {
                color: var(--R);
                background: var(--Rbg);
                border: 1px solid var(--Rborder);
            }
            .del-btn {
                background: none;
                border: none;
                color: #555;
                cursor: pointer;
                font-size: 0.78rem;
                margin-top: 0.45rem;
                transition: color 0.2s;
                padding: 0;
                display: flex;
                align-items: center;
                gap: 3px;
            }
            .del-btn:hover {
                color: var(--R);
            }

            .new-person-row {
                display: flex;
                gap: 0.5rem;
                margin-bottom: 0.75rem;
            }
            .person-block {
                background: var(--bg2);
                border: 1px solid var(--border);
                border-radius: 16px;
                margin-bottom: 0.7rem;
                overflow: hidden;
                transition: border-color 0.3s;
            }
            .person-block.is-paid {
                border-color: #1a5a30;
            }
            .person-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 1rem 1.2rem;
                cursor: pointer;
                transition: background 0.2s;
            }
            .person-head:hover {
                background: var(--bg3);
            }
            .avatar {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: "Bebas Neue", sans-serif;
                font-size: 1.05rem;
                letter-spacing: 1px;
                color: #fff;
                flex-shrink: 0;
                transition: background 0.3s;
            }
            .person-nm {
                font-weight: 600;
                font-size: 0.97rem;
            }
            .person-sub {
                font-size: 0.73rem;
                color: var(--muted);
                margin-top: 1px;
            }
            .person-total-val {
                font-family: "Bebas Neue", sans-serif;
                font-size: 1.3rem;
                letter-spacing: 1px;
                color: var(--R);
            }
            .chevron {
                transition: transform 0.25s;
                font-size: 1rem;
                color: var(--muted);
            }
            .chevron.open {
                transform: rotate(180deg);
            }
            .pbody {
                padding: 0 1.2rem 1.2rem;
                border-top: 1px solid var(--border);
            }
            .pbody.hidden {
                display: none;
            }

            .order-row {
                display: flex;
                gap: 0.55rem;
                margin-top: 0.9rem;
                flex-wrap: wrap;
                align-items: center;
            }
            .items-list {
                margin-top: 0.85rem;
                display: flex;
                flex-direction: column;
                gap: 0.4rem;
            }
            .oi {
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: var(--bg3);
                border-radius: 10px;
                padding: 0.55rem 0.9rem;
                font-size: 0.84rem;
                border: 1px solid var(--border);
            }
            .oi-nm {
                flex: 1;
                font-weight: 500;
            }
            .oi-ctrl {
                display: flex;
                align-items: center;
                gap: 0.4rem;
            }
            .qbtn {
                width: 26px;
                height: 26px;
                border-radius: 7px;
                border: 1px solid var(--border);
                background: var(--bg2);
                color: var(--text);
                font-size: 1rem;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.15s;
                line-height: 1;
            }
            .qbtn:hover {
                border-color: var(--R);
                color: var(--R);
            }
            .qnum {
                min-width: 22px;
                text-align: center;
                font-weight: 600;
                font-size: 0.9rem;
                color: var(--R);
            }
            .oi-price {
                color: var(--R);
                font-weight: 600;
                min-width: 70px;
                text-align: right;
                font-size: 0.86rem;
            }
            .oi-del {
                background: none;
                border: none;
                color: #555;
                cursor: pointer;
                font-size: 0.83rem;
                margin-left: 0.4rem;
                transition: color 0.15s;
                padding: 0;
            }
            .oi-del:hover {
                color: var(--R);
            }

            .pay-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-top: 0.9rem;
                padding-top: 0.85rem;
                border-top: 1px solid var(--Rborder);
            }
            .pay-total-lbl {
                font-size: 0.75rem;
                color: var(--muted);
                margin-bottom: 2px;
            }
            .pay-total-val {
                font-family: "Bebas Neue", sans-serif;
                font-size: 1.55rem;
                color: var(--R);
                letter-spacing: 1px;
            }
            .paid-badge {
                background: var(--Gbg);
                color: var(--G);
                font-size: 0.78rem;
                font-weight: 600;
                padding: 6px 12px;
                border-radius: 20px;
                display: flex;
                align-items: center;
                gap: 5px;
                border: 1px solid rgba(39, 168, 91, 0.3);
            }

            .summary-strip {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 0.65rem;
                margin-bottom: 0.75rem;
            }
            .metric {
                background: var(--bg2);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 0.9rem 1.1rem;
            }
            .metric.pend-card {
                background: #0d0000;
                border-color: var(--Rborder);
            }
            .metric-lbl {
                font-size: 0.73rem;
                color: var(--muted);
                margin-bottom: 0.3rem;
                display: flex;
                align-items: center;
                gap: 4px;
            }
            .metric-lbl.rlbl {
                color: #ff7777;
            }
            .metric-num {
                font-family: "Bebas Neue", sans-serif;
                font-size: 1.5rem;
                letter-spacing: 1px;
                color: var(--text);
            }
            .metric-num.col-r {
                color: var(--R);
            }
            .metric-num.col-g {
                color: var(--G);
            }
            .metric-num.col-p {
                color: var(--R);
            }

            .dash-section {
                background: var(--bg2);
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 1.2rem 1.3rem;
                margin-bottom: 0.75rem;
            }
            .dash-title {
                font-family: "Bebas Neue", sans-serif;
                font-size: 1.1rem;
                letter-spacing: 1px;
                color: var(--R);
                margin-bottom: 0.9rem;
                display: flex;
                align-items: center;
                gap: 0.4rem;
            }

            .pay-history {
                display: flex;
                flex-direction: column;
                gap: 0.4rem;
                max-height: 280px;
                overflow-y: auto;
            }
            .pay-history::-webkit-scrollbar {
                width: 4px;
            }
            .pay-history::-webkit-scrollbar-track {
                background: transparent;
            }
            .pay-history::-webkit-scrollbar-thumb {
                background: var(--Rborder);
                border-radius: 4px;
            }
            .ph-item {
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: var(--bg3);
                border-radius: 10px;
                padding: 0.65rem 0.95rem;
                font-size: 0.84rem;
                border: 1px solid var(--border);
            }
            .ph-left {
                display: flex;
                align-items: center;
                gap: 0.65rem;
            }
            .ph-av {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                background: var(--G);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 0.7rem;
                font-weight: 600;
                color: #fff;
                font-family: "Bebas Neue", sans-serif;
                letter-spacing: 1px;
            }
            .ph-nm {
                font-weight: 500;
            }
            .ph-time {
                font-size: 0.72rem;
                color: var(--muted);
            }
            .ph-val {
                color: var(--G);
                font-weight: 600;
                font-family: "Bebas Neue", sans-serif;
                font-size: 1.05rem;
                letter-spacing: 0.5px;
            }

            .bar-wrap {
                margin-top: 0.4rem;
            }
            .bar-row {
                display: flex;
                align-items: center;
                gap: 0.65rem;
                margin-bottom: 0.55rem;
                font-size: 0.81rem;
            }
            .bar-nm {
                min-width: 85px;
                color: var(--text);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .bar-bg {
                flex: 1;
                background: var(--bg3);
                border-radius: 4px;
                height: 9px;
                overflow: hidden;
                border: 1px solid var(--border);
            }
            .bar-fill {
                height: 100%;
                border-radius: 4px;
                transition: width 0.4s;
            }
            .bar-val {
                min-width: 72px;
                text-align: right;
                color: var(--R);
                font-size: 0.78rem;
                font-weight: 600;
            }

            .prog-ring {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 1.5rem;
                padding: 0.4rem 0;
            }
            .ring-wrap {
                position: relative;
                width: 90px;
                height: 90px;
            }
            .ring-wrap svg {
                transform: rotate(-90deg);
            }
            .ring-label {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                text-align: center;
            }
            .ring-pct {
                font-family: "Bebas Neue", sans-serif;
                font-size: 1.3rem;
                color: var(--text);
                letter-spacing: 1px;
            }
            .ring-sub {
                font-size: 0.65rem;
                color: var(--muted);
            }

            .empty {
                text-align: center;
                padding: 2.2rem 1rem;
                color: var(--muted);
                font-size: 0.85rem;
            }
            .empty i {
                font-size: 1.8rem;
                display: block;
                margin-bottom: 0.5rem;
                opacity: 0.25;
            }

            .tag-pend {
                background: var(--Rbg);
                color: var(--R);
                font-size: 0.7rem;
                font-weight: 600;
                padding: 2px 8px;
                border-radius: 20px;
                border: 1px solid var(--Rborder);
            }
            .tag-paid {
                background: var(--Gbg);
                color: var(--G);
                font-size: 0.7rem;
                font-weight: 600;
                padding: 2px 8px;
                border-radius: 20px;
                border: 1px solid rgba(39, 168, 91, 0.3);
            }

            .toast {
                position: fixed;
                bottom: 1.5rem;
                right: 1.5rem;
                background: var(--bg2);
                border: 1px solid var(--R);
                color: var(--text);
                padding: 0.75rem 1.2rem;
                border-radius: 12px;
                font-size: 0.85rem;
                font-weight: 500;
                z-index: 999;
                transform: translateY(80px);
                opacity: 0;
                transition: all 0.3s;
                max-width: 280px;
            }
            .toast.show {
                transform: translateY(0);
                opacity: 1;
            }
        </style>
    </head>
    <body>
        <div id="app">
            <div class="topbar">
                <div>
                    <div class="logo">
                        Estoque do Beiço<small
                            >gestão de estoque &amp; pedidos</small
                        >
                    </div>
                </div>
                <button class="clear-btn" onclick="clearAll()">
                    <i class="ti ti-trash"></i> Limpar tudo
                </button>
            </div>
            <div class="tabs">
                <button class="tab active" onclick="showTab('estoque')">
                    <i class="ti ti-package"></i> Estoque
                </button>
                <button class="tab" onclick="showTab('pedidos')">
                    <i class="ti ti-tools-kitchen-2"></i> Pedidos
                </button>
                <button class="tab" onclick="showTab('dashboard')">
                    <i class="ti ti-chart-bar"></i> Dashboard
                </button>
            </div>

            <!-- ESTOQUE -->
            <div id="tab-estoque" class="section active">
                <div class="card">
                    <div class="card-title">Adicionar produto</div>
                    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap">
                        <input
                            class="inp"
                            id="pn"
                            placeholder="Nome do produto"
                            style="flex: 2; min-width: 130px"
                        />
                        <input
                            class="inp"
                            id="pp"
                            type="number"
                            min="0"
                            step="0.01"
                            placeholder="Preço venda (R$)"
                            style="flex: 1; min-width: 110px"
                        />
                        <input
                            class="inp"
                            id="pc2"
                            type="number"
                            min="0"
                            step="0.01"
                            placeholder="Custo (R$)"
                            style="flex: 1; min-width: 100px"
                        />
                        <button class="btn" onclick="addProd()">
                            <i class="ti ti-plus"></i> Adicionar
                        </button>
                    </div>
                </div>
                <div class="card" style="margin-bottom: 0">
                    <div
                        style="
                            display: flex;
                            align-items: center;
                            justify-content: space-between;
                            margin-bottom: 0.9rem;
                        "
                    >
                        <span class="card-title" style="margin: 0"
                            >Produtos cadastrados</span
                        >
                        <span
                            id="pcount"
                            style="font-size: 0.78rem; color: var(--muted)"
                            >0 itens</span
                        >
                    </div>
                    <div id="plist" class="prod-grid">
                        <div class="empty" style="grid-column: 1/-1">
                            <i class="ti ti-package"></i>Nenhum produto ainda.
                        </div>
                    </div>
                </div>
            </div>

            <!-- PEDIDOS -->
            <div id="tab-pedidos" class="section">
                <div class="new-person-row">
                    <input
                        class="inp"
                        id="per-inp"
                        placeholder="Nome da pessoa"
                        style="flex: 1"
                    />
                    <button class="btn" onclick="addPerson()">
                        <i class="ti ti-user-plus"></i> Adicionar
                    </button>
                </div>
                <div id="persons-list">
                    <div class="empty">
                        <i class="ti ti-users"></i>Adicione pessoas para
                        registrar pedidos.
                    </div>
                </div>
            </div>

            <!-- DASHBOARD -->
            <div id="tab-dashboard" class="section">
                <div class="summary-strip" id="metrics"></div>
                <div id="lucro-banner" style="display: none"></div>
                <div
                    style="
                        display: grid;
                        grid-template-columns: 1fr 1fr;
                        gap: 0.75rem;
                    "
                >
                    <div class="dash-section">
                        <div class="dash-title">
                            <i class="ti ti-clock-check"></i> Pagamentos
                            recebidos
                        </div>
                        <div id="pay-hist" class="pay-history">
                            <div class="empty" style="padding: 1.2rem">
                                <i class="ti ti-coin"></i>Nenhum pagamento
                                ainda.
                            </div>
                        </div>
                    </div>
                    <div class="dash-section">
                        <div class="dash-title">
                            <i class="ti ti-chart-bar"></i> Pedido por pessoa
                        </div>
                        <div id="bars" class="bar-wrap">
                            <div class="empty" style="padding: 1.2rem">
                                <i class="ti ti-chart-bar"></i>Sem dados.
                            </div>
                        </div>
                    </div>
                </div>
                <div class="dash-section">
                    <div class="dash-title">
                        <i class="ti ti-circle-check"></i> Status de pagamentos
                    </div>
                    <div class="prog-ring" id="rings">
                        <div class="empty" style="padding: 0.8rem">
                            Sem pessoas cadastradas.
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="toast" id="toast"></div>

        <script>
            /* ─── LocalStorage keys ─── */
            const K = {
                prods: "sq_prods",
                persons: "sq_persons",
                pays: "sq_pays",
                ids: "sq_ids",
            };

            let prods = [],
                persons = [],
                payments = [];
            let pidC = 0,
                perC = 0;

            function loadLS() {
                try {
                    prods = JSON.parse(localStorage.getItem(K.prods) || "[]");
                    persons = JSON.parse(
                        localStorage.getItem(K.persons) || "[]",
                    );
                    payments = JSON.parse(localStorage.getItem(K.pays) || "[]");
                    payments = payments.map((p) => ({
                        ...p,
                        time: new Date(p.time),
                    }));
                    const ids = JSON.parse(
                        localStorage.getItem(K.ids) || '{"pidC":0,"perC":0}',
                    );
                    pidC = ids.pidC || 0;
                    perC = ids.perC || 0;
                } catch (e) {
                    prods = [];
                    persons = [];
                    payments = [];
                    pidC = 0;
                    perC = 0;
                }
            }

            function saveLS() {
                try {
                    localStorage.setItem(K.prods, JSON.stringify(prods));
                    localStorage.setItem(K.persons, JSON.stringify(persons));
                    localStorage.setItem(K.pays, JSON.stringify(payments));
                    localStorage.setItem(K.ids, JSON.stringify({ pidC, perC }));
                } catch (e) {}
            }

            function clearAll() {
                if (
                    !confirm(
                        "Apagar TODOS os dados? Esta ação não pode ser desfeita.",
                    )
                )
                    return;
                [K.prods, K.persons, K.pays, K.ids].forEach((k) =>
                    localStorage.removeItem(k),
                );
                prods = [];
                persons = [];
                payments = [];
                pidC = 0;
                perC = 0;
                renderProds();
                renderPersons();
                toast("🗑 Dados apagados com sucesso.");
            }

            /* ─── Helpers ─── */
            const fmt = (v) =>
                v.toLocaleString("pt-BR", {
                    style: "currency",
                    currency: "BRL",
                });
            const ini = (n) =>
                (n || "?")
                    .trim()
                    .split(/\s+/)
                    .map((w) => w[0])
                    .join("")
                    .toUpperCase()
                    .slice(0, 2) || "?";
            const esc = (s) =>
                String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
            const COLS = [
                "#cc0000",
                "#aa1100",
                "#991133",
                "#bb2200",
                "#882200",
            ];
            const col = (i) => COLS[i % COLS.length];
            const perTotal = (p) =>
                (p.items || []).reduce((s, i) => s + i.price * i.qty, 0);

            let toastTimer;
            function toast(msg) {
                clearTimeout(toastTimer);
                const t = document.getElementById("toast");
                t.textContent = msg;
                t.classList.add("show");
                toastTimer = setTimeout(() => t.classList.remove("show"), 2400);
            }

            function showTab(t) {
                document
                    .querySelectorAll(".tab")
                    .forEach((el, i) =>
                        el.classList.toggle(
                            "active",
                            ["estoque", "pedidos", "dashboard"][i] === t,
                        ),
                    );
                document
                    .querySelectorAll(".section")
                    .forEach((el) => el.classList.remove("active"));
                document.getElementById("tab-" + t).classList.add("active");
                if (t === "dashboard") renderDash();
                if (t === "pedidos") renderPersons();
            }

            /* ═══════════════════════════════
   PRODUTOS
═══════════════════════════════ */
            function addProd() {
                const n = document.getElementById("pn").value.trim();
                const p = parseFloat(document.getElementById("pp").value);
                const c = parseFloat(document.getElementById("pc2").value) || 0;
                if (!n || isNaN(p) || p < 0) {
                    toast("⚠ Preencha nome e preço válidos.");
                    return;
                }
                prods.push({
                    id: ++pidC,
                    name: n,
                    price: p,
                    cost: c,
                    stock: 0,
                });
                document.getElementById("pn").value = "";
                document.getElementById("pp").value = "";
                document.getElementById("pc2").value = "";
                document.getElementById("pn").focus();
                saveLS();
                renderProds();
                toast(`✓ "${n}" adicionado.`);
            }

            function delProd(id) {
                const p = prods.find((p) => p.id === id);
                prods = prods.filter((p) => p.id !== id);
                persons.forEach((p) => {
                    p.items = p.items.filter((i) => i.pid !== id);
                });
                saveLS();
                renderProds();
                renderPersons();
                if (p) toast(`Produto "${p.name}" removido.`);
            }

            function renderProds() {
                const el = document.getElementById("plist");
                document.getElementById("pcount").textContent =
                    prods.length + " ite" + (prods.length === 1 ? "m" : "ns");
                if (!prods.length) {
                    el.innerHTML =
                        '<div class="empty" style="grid-column:1/-1"><i class="ti ti-package"></i>Nenhum produto ainda.</div>';
                    return;
                }
                el.innerHTML = prods
                    .map((p) => {
                        const lucro = p.price - p.cost;
                        const hasLucro = p.cost > 0;
                        return `
    <div class="prod-card">
      <div class="prod-nm">${esc(p.name)}</div>
      <div class="prod-row">
        <span class="prod-price">${fmt(p.price)}</span>
        ${hasLucro ? `<span class="prod-stk" style="color:${lucro >= 0 ? "#27a85b" : "var(--R)"}">lucro: ${fmt(lucro)}</span>` : '<span class="prod-stk">sem custo</span>'}
      </div>
      ${hasLucro ? `<div style="font-size:.72rem;color:var(--muted);margin-top:.25rem">custo: ${fmt(p.cost)}</div>` : ""}
      <button class="del-btn" onclick="delProd(${p.id})"><i class="ti ti-x"></i> remover</button>
    </div>`;
                    })
                    .join("");
            }

            /* ═══════════════════════════════
   PESSOAS
═══════════════════════════════ */
            function addPerson() {
                const n = document.getElementById("per-inp").value.trim();
                if (!n) return;
                persons.push({
                    id: ++perC,
                    name: n,
                    items: [],
                    paid: false,
                    open: true,
                });
                document.getElementById("per-inp").value = "";
                saveLS();
                renderPersons();
            }

            function remPerson(id) {
                const p = persons.find((p) => p.id === id);
                persons = persons.filter((p) => p.id !== id);
                saveLS();
                renderPersons();
                if (p) toast(`"${p.name}" removido(a).`);
            }

            function toggleP(id) {
                const p = persons.find((p) => p.id === id);
                if (p) {
                    p.open = !p.open;
                    saveLS();
                    renderPersons();
                }
            }

            function addItem(pId) {
                const sel = document.getElementById("sel-" + pId);
                if (!sel || !sel.value) return;
                const prod = prods.find((p) => p.id === parseInt(sel.value));
                if (!prod) return;
                const per = persons.find((p) => p.id === pId);
                const ex = per.items.find((i) => i.pid === prod.id);
                if (ex) ex.qty += 1;
                else
                    per.items.push({
                        pid: prod.id,
                        name: prod.name,
                        price: prod.price,
                        qty: 1,
                    });
                saveLS();
                renderPersons();
            }

            function chgQty(pId, pid, d) {
                const per = persons.find((p) => p.id === pId);
                const it = per.items.find((i) => i.pid === pid);
                if (!it) return;
                it.qty += d;
                if (it.qty <= 0)
                    per.items = per.items.filter((i) => i.pid !== pid);
                saveLS();
                renderPersons();
            }

            function remItem(pId, pid) {
                const per = persons.find((p) => p.id === pId);
                per.items = per.items.filter((i) => i.pid !== pid);
                saveLS();
                renderPersons();
            }

            /* Confirmar pagamento — salva snapshot do valor pago */
            function confirmPay(pId) {
                const per = persons.find((p) => p.id === pId);
                if (!per || per.paid) return;
                const amt = perTotal(per);
                payments.push({
                    payId: Date.now() + "_" + pId,
                    personId: per.id,
                    name: per.name,
                    amount: amt,
                    items: per.items.map((i) => {
                        const prod = prods.find((p) => p.id === i.pid);
                        return {
                            pid: i.pid,
                            qty: i.qty,
                            price: i.price,
                            cost: prod && prod.cost > 0 ? prod.cost : 0,
                        };
                    }),
                    time: new Date(),
                });
                /* Animação de saída no card antes de remover */
                const block = document.querySelector(`[data-pid="${pId}"]`);
                if (block) {
                    block.style.transition = "opacity .35s, transform .35s";
                    block.style.opacity = "0";
                    block.style.transform = "translateX(40px)";
                    setTimeout(() => {
                        persons = persons.filter((p) => p.id !== pId);
                        saveLS();
                        renderPersons();
                    }, 360);
                } else {
                    persons = persons.filter((p) => p.id !== pId);
                    saveLS();
                    renderPersons();
                }
                toast(`✓ ${per.name} — ${fmt(amt)} pago e removido!`);
            }

            function renderPersons() {
                const el = document.getElementById("persons-list");
                if (!persons.length) {
                    el.innerHTML =
                        '<div class="empty"><i class="ti ti-users"></i>Adicione pessoas para registrar pedidos.</div>';
                    return;
                }
                const opts = prods.length
                    ? '<option value="">Escolher produto...</option>' +
                      prods
                          .map(
                              (p) =>
                                  `<option value="${p.id}">${esc(p.name)} — ${fmt(p.price)}</option>`,
                          )
                          .join("")
                    : '<option value="">Nenhum produto cadastrado</option>';

                el.innerHTML = persons
                    .map((per, idx) => {
                        const tot = perTotal(per);
                        const cnt = per.items.reduce((s, i) => s + i.qty, 0);
                        return `
    <div class="person-block" data-pid="${per.id}">
      <div class="person-head" onclick="toggleP(${per.id})">
        <div style="display:flex;align-items:center;gap:.7rem">
          <div class="avatar" style="background:${col(idx)}">${ini(per.name)}</div>
          <div>
            <div class="person-nm">${esc(per.name)} <span class="tag-pend">pendente</span></div>
            <div class="person-sub">${cnt} ite${cnt === 1 ? "m" : "ns"} no pedido</div>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:.7rem">
          <div class="person-total-val">${fmt(tot)}</div>
          <i class="ti ti-chevron-down chevron ${per.open ? "open" : ""}"></i>
        </div>
      </div>
      <div class="pbody ${per.open ? "" : "hidden"}">
        <div class="order-row">
          <select class="sel" id="sel-${per.id}" style="flex:2;min-width:140px">${opts}</select>
          <button class="btn btn-sm" onclick="addItem(${per.id})"><i class="ti ti-plus"></i> Item</button>
          <button class="btn btn-sm btn-ghost" onclick="remPerson(${per.id})"><i class="ti ti-trash"></i></button>
        </div>
        <div class="items-list">
          ${
              per.items.length === 0
                  ? '<div style="text-align:center;padding:.7rem;color:var(--muted);font-size:.82rem">Nenhum item adicionado.</div>'
                  : per.items
                        .map(
                            (it) => `
              <div class="oi">
                <span class="oi-nm">${esc(it.name)}</span>
                <div class="oi-ctrl">
                  <button class="qbtn" onclick="chgQty(${per.id},${it.pid},-1)">−</button>
                  <span class="qnum">${it.qty}</span>
                  <button class="qbtn" onclick="chgQty(${per.id},${it.pid},1)">+</button>
                </div>
                <span class="oi-price">${fmt(it.price * it.qty)}</span>
                <button class="oi-del" onclick="remItem(${per.id},${it.pid})"><i class="ti ti-x"></i></button>
              </div>`,
                        )
                        .join("")
          }
        </div>
        <div class="pay-row">
          <div>
            <div class="pay-total-lbl">Total do pedido</div>
            <div class="pay-total-val">${fmt(tot)}</div>
          </div>
          <button class="btn btn-green" onclick="confirmPay(${per.id})"
            ${per.items.length === 0 ? 'disabled style="opacity:.35;cursor:not-allowed"' : ""}>
            <i class="ti ti-cash"></i> Confirmar pagamento
          </button>
        </div>
      </div>
    </div>`;
                    })
                    .join("");
            }

            /* ═══════════════════════════════
   DASHBOARD
═══════════════════════════════ */
            function renderDash() {
                /* Recebido = soma dos registros em payments (persistente) */
                const totalRecebido = payments.reduce(
                    (s, p) => s + p.amount,
                    0,
                );
                /* Pendente = soma das pessoas que ainda não pagaram */
                const pendente = persons.reduce((s, p) => s + perTotal(p), 0);
                /* Quantos pagaram = payments.length (pessoas removidas ao pagar) */
                const paidCount = payments.length;
                /* Lucro = recebido - custo snapshot dos itens pagos */
                const totalCusto = payments.reduce((s, pay) => {
                    return (
                        s +
                        (pay.items || []).reduce(
                            (ss, it) => ss + (it.cost || 0) * it.qty,
                            0,
                        )
                    );
                }, 0);
                const lucro = totalRecebido - totalCusto;
                const temCusto = payments.some((pay) =>
                    (pay.items || []).some((it) => it.cost > 0),
                );

                document.getElementById("metrics").innerHTML = `
    <div class="metric">
      <div class="metric-lbl"><i class="ti ti-users"></i> Pagaram</div>
      <div class="metric-num col-g">${paidCount}</div>
    </div>
    <div class="metric">
      <div class="metric-lbl"><i class="ti ti-clock"></i> Aguardando</div>
      <div class="metric-num col-r">${persons.length}</div>
    </div>
    <div class="metric">
      <div class="metric-lbl"><i class="ti ti-check"></i> Recebido</div>
      <div class="metric-num col-g">${fmt(totalRecebido)}</div>
    </div>
    <div class="metric pend-card">
      <div class="metric-lbl rlbl"><i class="ti ti-clock"></i> Pendente</div>
      <div class="metric-num col-p">${fmt(pendente)}</div>
    </div>`;

                /* Card de lucro — só exibe se houve pagamentos com custo cadastrado */
                const lucroBanner = document.getElementById("lucro-banner");
                if (payments.length && temCusto) {
                    lucroBanner.style.display = "block";
                    const pos = lucro >= 0;
                    lucroBanner.innerHTML = `
      <div class="dash-section" style="border-color:${pos ? "#1a5a30" : "var(--Rborder)"};background:${pos ? "#050f09" : "#0d0000"};margin-bottom:.75rem">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.75rem">
          <div>
            <div style="font-size:.75rem;color:${pos ? "#27a85b" : "#ff5555"};margin-bottom:.25rem;font-weight:600;letter-spacing:.5px">
              <i class="ti ti-trending-${pos ? "up" : "down"}"></i> ${pos ? "LUCRO TOTAL" : "PREJUÍZO TOTAL"}
            </div>
            <div style="font-family:'Bebas Neue',sans-serif;font-size:2.2rem;letter-spacing:2px;color:${pos ? "#27a85b" : "var(--R)"}">
              ${pos ? "" : "-"}${fmt(Math.abs(lucro))}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:.3rem;text-align:right;font-size:.82rem">
            <div>💰 Recebido: <strong style="color:#27a85b">${fmt(totalRecebido)}</strong></div>
            <div>📦 Custo total: <strong style="color:var(--R)">${fmt(totalCusto)}</strong></div>
            <div style="color:var(--muted);font-size:.75rem">margem: ${totalRecebido > 0 ? Math.round((lucro / totalRecebido) * 100) : 0}%</div>
          </div>
        </div>
      </div>`;
                } else {
                    lucroBanner.style.display = "none";
                }

                /* Histórico de pagamentos */
                const hist = document.getElementById("pay-hist");
                hist.innerHTML = payments.length
                    ? [...payments]
                          .reverse()
                          .map(
                              (p) => `
        <div class="ph-item">
          <div class="ph-left">
            <div class="ph-av">${ini(p.name)}</div>
            <div>
              <div class="ph-nm">${esc(p.name)}</div>
              <div class="ph-time">${new Date(p.time).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</div>
            </div>
          </div>
          <div class="ph-val">${fmt(p.amount)}</div>
        </div>`,
                          )
                          .join("")
                    : '<div class="empty" style="padding:1.2rem"><i class="ti ti-coin"></i>Nenhum pagamento ainda.</div>';

                /* Barras — combina pessoas pendentes + payments */
                const barsEl = document.getElementById("bars");
                const allEntries = [
                    ...payments.map((p) => ({
                        name: p.name,
                        val: p.amount,
                        paid: true,
                    })),
                    ...persons.map((p) => ({
                        name: p.name,
                        val: perTotal(p),
                        paid: false,
                    })),
                ];
                const maxVal = allEntries.length
                    ? Math.max(...allEntries.map((e) => e.val), 1)
                    : 1;
                barsEl.innerHTML = allEntries.length
                    ? allEntries
                          .map((e) => {
                              const pct = Math.round((e.val / maxVal) * 100);
                              return `<div class="bar-row">
          <span class="bar-nm">${esc(e.name)}</span>
          <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;background:${e.paid ? "#27a85b" : "var(--R)"}"></div></div>
          <span class="bar-val">${fmt(e.val)}</span>
        </div>`;
                          })
                          .join("")
                    : '<div class="empty" style="padding:1.2rem"><i class="ti ti-chart-bar"></i>Sem dados.</div>';

                /* Anel de status — usa payments + persons pendentes */
                const ringsEl = document.getElementById("rings");
                const totalPessoas = paidCount + persons.length;
                if (!totalPessoas) {
                    ringsEl.innerHTML =
                        '<div class="empty" style="padding:.8rem">Sem pessoas ainda.</div>';
                    return;
                }
                const paidPct = Math.round((paidCount / totalPessoas) * 100);
                const r = 38,
                    circ = 2 * Math.PI * r;
                const arc = (circ * (paidCount / totalPessoas)).toFixed(2);
                ringsEl.innerHTML = `
    <div class="ring-wrap">
      <svg width="90" height="90" viewBox="0 0 90 90">
        <circle cx="45" cy="45" r="${r}" fill="none" stroke="#1e1e1e" stroke-width="9"/>
        <circle cx="45" cy="45" r="${r}" fill="none" stroke="#27a85b" stroke-width="9"
          stroke-dasharray="${arc} ${circ.toFixed(2)}" stroke-linecap="round"/>
      </svg>
      <div class="ring-label">
        <div class="ring-pct">${paidPct}%</div>
        <div class="ring-sub">pagos</div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:.65rem;justify-content:center">
      <div style="display:flex;align-items:center;gap:.5rem;font-size:.85rem">
        <span style="width:10px;height:10px;border-radius:2px;background:#27a85b;flex-shrink:0"></span>
        <span>${paidCount} pag${paidCount === 1 ? "ou" : "aram"} — <strong style="color:#27a85b">${fmt(totalRecebido)}</strong></span>
      </div>
      <div style="display:flex;align-items:center;gap:.5rem;font-size:.85rem">
        <span style="width:10px;height:10px;border-radius:2px;background:var(--R);flex-shrink:0"></span>
        <span>${persons.length} pendente${persons.length === 1 ? "" : "s"} — <strong style="color:var(--R)">${fmt(pendente)}</strong></span>
      </div>
      <div style="display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--muted)">
        <span style="width:10px;height:10px;border-radius:2px;background:#2a2a2a;flex-shrink:0"></span>
        <span>${totalPessoas} pessoa${totalPessoas === 1 ? "" : "s"} no total</span>
      </div>
    </div>`;
            }

            /* ─── Boot ─── */
            loadLS();
            renderProds();
            renderPersons();
            document.getElementById("pn").addEventListener("keydown", (e) => {
                if (e.key === "Enter") addProd();
            });
            document
                .getElementById("per-inp")
                .addEventListener("keydown", (e) => {
                    if (e.key === "Enter") addPerson();
                });
        </script>
    </body>
</html>
